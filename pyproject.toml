[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devsnap"
version = "0.1.0"
description = "Branch running application state, secrets, and local network tunnels for humans and AI coding agents"
readme = "README.md"
authors = [{ name = "DevSnap Authors" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
devsnap = "devsnap.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["devsnap*"]
